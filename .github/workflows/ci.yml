# Continuous integration — static type checking + test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Type check (mypy)
        run: mypy

      - name: Run tests
        run: pytest -q
