[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# PEP 621 Project Metadata
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "vortexdast"
version = "1.0.0"
description = "Lightweight, modular Dynamic Application Security Testing (DAST) framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "VortexDAST Contributors" }
]
keywords = [
    "security", "dast", "pentesting", "appsec",
    "xss", "sqli", "ssrf", "vulnerability-scanner",
    "web-security", "crawler"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]

# ── Runtime dependencies (mirrors requirements.txt, minus dev/test tools) ────
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "playwright>=1.44.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

# ─────────────────────────────────────────────────────────────────────────────
# CLI Entrypoints
#
# After `pip install -e .` (or `pip install .`) both of the following shell
# commands will be registered in the activated virtualenv / system bin:
#
#   vortex    -u https://target.example.com
#   vortexdast -u https://target.example.com
#
# Both map to the same `main()` function in scanner.py.
# ─────────────────────────────────────────────────────────────────────────────
[project.scripts]
vortex    = "scanner:main"
vortexdast = "scanner:main"

# ─────────────────────────────────────────────────────────────────────────────
# Optional dependency groups
# ─────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]

# ─────────────────────────────────────────────────────────────────────────────
# Setuptools package discovery
# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
# scanner.py lives at the project root, so declare it as a top-level module.
py-modules = ["scanner"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "payloads*"]
exclude = ["tests*", "*.egg-info", "__pycache__"]

# ── Include non-Python data files ─────────────────────────────────────────────
[tool.setuptools.package-data]
"*" = [
    "payloads/*.json",
    "config.yaml",
]

# ─────────────────────────────────────────────────────────────────────────────
# Project URLs
# ─────────────────────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/vortexdast/vortexdast"
Repository    = "https://github.com/vortexdast/vortexdast"
"Bug Tracker" = "https://github.com/vortexdast/vortexdast/issues"

# ─────────────────────────────────────────────────────────────────────────────
# Tool configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["core", "modules", "scanner"]
omit   = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ─────────────────────────────────────────────────────────────────────────────
# Pyrefly (type-checker / LSP) configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.pyrefly]
# Pyrefly infers the import root automatically from the editable install and
# project layout — `core.*` and `modules.*` are resolved from the repo root.
# Listing the interpreter ensures pyrefly uses the correct site-packages.
python_interpreter = "/usr/bin/python3"
project_includes = [
    "scanner.py",
    "core/**/*.py",
    "modules/**/*.py",
]
